name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .
          pip install -e examples/plugins/fixture-connectors
      - name: Public safety and documentation
        run: |
          python scripts/scan_pii.py
          python scripts/check_docs.py
      - name: Ruff
        run: |
          ruff check jobtracker tests scripts
          ruff format --check jobtracker tests scripts
      - name: Python tests and ResourceWarning gate
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
  postgres:
    name: PostgreSQL 16 integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jobtracker_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SUPABASE_TEST_DB_URL: postgresql://postgres:postgres@127.0.0.1:5432/jobtracker_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: |
          pip install -r requirements-dev.txt -e '.[postgres]'
          pip install -e examples/plugins/fixture-connectors
      - name: Bootstrap plain PostgreSQL roles
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d jobtracker_test -f db/ci/plain_postgres_bootstrap.sql
      - name: Full suite and coverage with PostgreSQL integration
        run: |
          coverage run -m unittest discover -s tests -v
          coverage report --fail-under=85
          coverage xml

  crm:
    name: CRM / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: crm/package-lock.json
      - name: Install, test, lint, build
        working-directory: crm
        run: |
          npm ci
          npm test
          npm run lint
          npm run build
