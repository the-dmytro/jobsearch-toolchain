name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jobtracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SUPABASE_TEST_DB_URL: postgresql://postgres:postgres@127.0.0.1:5432/jobtracker_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Bootstrap plain Postgres roles
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d jobtracker_test -f db/ci/plain_postgres_bootstrap.sql

      - name: PII scan
        run: python3 scripts/scan_pii.py

      - name: Python tests with coverage
        run: |
          coverage run -m unittest discover -s tests -v
          coverage report --fail-under=85
          coverage xml

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: CRM install, test, and build
        working-directory: crm
        run: |
          npm ci
          npm run test --if-present
          npm run build
