[role_lane]
name = "fictitious-software-roles"
include_terms = ["engineer", "developer", "розробник"]
exclude_terms = [
  "android",
  "intern",
  "recruiter"
]

[providers.dou]
feed_url = "https://jobs.dou.ua/vacancies/feeds/"
listing_url = "https://jobs.dou.ua/vacancies/"
default_detail_limit = 10

[providers.workua]
listing_urls = ["https://www.work.ua/jobs-it/"]
default_detail_limit = 10

[providers.djinni]
listing_url = "https://djinni.co/jobs/keyword-software-engineer/"
default_detail_limit = 10
experimental = true

[providers.greenhouse]
manual_board_tokens = ["fixture"]
denylist = []
default_max_boards = 10

[providers.ashby]
manual_board_tokens = ["default"]
default_max_boards = 10

[providers.lever]
manual_board_tokens = ["default"]
default_max_boards = 10
