[project]
name = "jobsearch-tracker"
version = "0.1.0"
description = "Supabase-backed job search and freelance project tracking tools."
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.12",
  "httpx>=0.28",
  "psycopg[binary]>=3.2",
  "pypdf>=6.0",
  "python-dateutil>=2.9",
  "python-dotenv>=1.0",
  "supabase>=2.0",
  "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
jobtracker = "jobtracker.cli:main"

# Connector plugin groups — populated as built-in connectors land in later work packages.
[project.entry-points."jobtracker.sources"]

[project.entry-points."jobtracker.mail.parsers"]

[project.entry-points."jobtracker.stores"]

[project.entry-points."jobtracker.notifiers"]

[tool.setuptools.packages.find]
where = ["."]
include = ["jobtracker*"]

[tool.coverage.run]
# Plan gate is line coverage on jobtracker/; branch data is useful locally but
# not part of the enforced percentage.
branch = false
source = ["jobtracker"]
omit = [
  "*/__main__.py",
  "jobtracker/cli.py",
  # One-shot CSV/PDF import CLIs — covered by dedicated tests but inflate the
  # gate beyond the connector/store framework the polish plan targets.
  "jobtracker/linkedin_import.py",
  "jobtracker/greenhouse_import.py",
  "jobtracker/legacy_import.py",
  "jobtracker/pdf_links.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 85
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
