[project]
name = "jobsearch-tracker"
version = "0.2.0"
description = "Local-first job search automation, tracking, and analytics tools."
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.12",
  "httpx>=0.28",
  "python-dateutil>=2.9",
  "python-dotenv>=1.0",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
supabase = ["supabase>=2.0"]
legacy-import = ["pypdf>=6.0"]

[project.scripts]
jobtracker = "jobtracker.cli:main"

# Connector plugin groups — populated as built-in connectors land in later work packages.
[project.entry-points."jobtracker.sources"]

[project.entry-points."jobtracker.mail.parsers"]

[project.entry-points."jobtracker.mail.inboxes"]

[project.entry-points."jobtracker.mail.senders"]

[project.entry-points."jobtracker.stores"]

[project.entry-points."jobtracker.db_connectors"]

[project.entry-points."jobtracker.notifiers"]

[project.entry-points."jobtracker.calendars"]

[tool.setuptools.packages.find]
where = ["."]
include = ["jobtracker*"]

[tool.coverage.run]
# Plan gate is line coverage on jobtracker/; branch data is useful locally but
# not part of the enforced percentage.
branch = false
source = ["jobtracker"]
omit = [
  "*/__main__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 85
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
