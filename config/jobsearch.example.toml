schema_version = 1

[paths]
config_dir = "config"
profile_dir = "profile"
output_dir = "outputs"
payload_dir = "outputs/automation-payloads"

[store]
backend = "sqlite"
sqlite_path = "outputs/jobsearch.sqlite3"
artifact_backend = "local"
artifact_local_path = "outputs/artifacts"

[pipelines.jobboards]
type = "jobboard"
profile = "generic"
providers = ["example_jsonld"]
include_db = true
max_pages = 1

# Config-only sources (no Python). Add the slug to a pipeline's providers list to run.
[sources.example_jsonld]
kind = "jsonld"
listing_url = "https://careers.example.invalid/jobs"
detail_limit = 10

[sources.example_jsonld.role_lane]
name = "configured-role-lane"
include_terms = ["engineer", "developer"]
exclude_terms = ["intern", "manager"]

# Notifications and mail are opt-in. Secrets are environment variables, never TOML values.
# [pipelines.jobboards.notify]
# channels = ["email"]
# [notify.email]
# kind = "email"
# to_env = "JOBTRACKER_REPORT_EMAIL"
# [mail.inbox]
# kind = "imap"
# [mail.outbox]
# kind = "smtp"

# Calendar is opt-in: keeps interview events in step with invites and mail.
# Credentials come from .env (user_env/password_env name the variables).
# [calendar]
# kind = "caldav"                      # or "icsdir" with path = "outputs/calendar" for offline use
# url = "https://caldav.example.com/"  # CalDAV discovery root
# calendar = "Interviews"
# default_timezone = "UTC"
# alarms_minutes = [60, 15]
# cancel_prefix = "Cancelled: "
# user_env = "JOBTRACKER_CALDAV_USER"
# password_env = "JOBTRACKER_CALDAV_PASSWORD"
