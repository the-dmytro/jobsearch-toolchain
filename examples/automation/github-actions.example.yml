name: Jobboard automation

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  jobboards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e .
      - name: Doctor (offline schema/profile checks)
        run: python -m jobtracker doctor --skip-network
      - name: Run jobboards pipeline (fixture dry-run)
        run: python -m jobtracker run jobboards --dry-run --fixture-dir jobtracker/fixtures/provider_fetch
        env:
          JOBTRACKER_DATABASE_URL: ${{ secrets.JOBTRACKER_DATABASE_URL }}
